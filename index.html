<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4a90d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Меню и Рецепты</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f4f8;
    color: #1a2b3c;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)) 16px;
    line-height: 1.5;
  }
  .container { max-width: 800px; margin: 0 auto; }

  header {
    background: linear-gradient(135deg, #4a90d9, #6ab04c);
    color: #fff;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  header h1 { font-size: 1.4rem; margin-bottom: 4px; }
  header p { opacity: 0.9; font-size: 0.85rem; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    color: #6b7c8f;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab.active { background: #4a90d9; color: #fff; }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.25s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Конструктор */
  .builder-row {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .builder-row h4 { color: #4a90d9; font-size: 1rem; margin-bottom: 4px; }
  .builder-row select {
    width: 100%;
    padding: 10px;
    border: 1px solid #d6dee6;
    border-radius: 8px;
    font-size: 0.95rem;
    background: #f8fafc;
    color: #1a2b3c;
    outline: none;
  }
  .builder-row label { font-size: 0.8rem; color: #6b7c8f; font-weight: 600; margin-bottom: -4px; display: block; }

  /* Меню */
  .days { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .day-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-left: 4px solid #4a90d9;
  }
  .day-card h3 { font-size: 1rem; margin-bottom: 10px; color: #4a90d9; border-bottom: 1px solid #eef2f6; padding-bottom: 6px; }
  .meal-item { margin-bottom: 8px; font-size: 0.95rem; }
  .meal-item b { color: #6b7c8f; font-size: 0.85rem; display: block; }
  .meal-item span { font-weight: 500; }

  /* Покупки */
  .shop-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .shop-cat {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .shop-cat h3 { font-size: 0.95rem; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid #eef2f6; color: #4a90d9; }
  .shop-item { display: flex; align-items: flex-start; font-size: 0.95rem; padding: 6px 0; }
  .shop-item input { margin-right: 12px; margin-top: 2px; cursor: pointer; width: 20px; height: 20px; flex-shrink: 0; }
  .shop-item.done label { text-decoration: line-through; opacity: 0.45; }
  .shop-item label { cursor: pointer; flex: 1; display: flex; justify-content: space-between; }
  .shop-item .qty { color: #8a9bb0; font-size: 0.8rem; margin-left: 8px; }

  .progress-wrap { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .progress-bar { height: 10px; background: #eef2f6; border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #4a90d9, #6ab04c); width: 0%; transition: width 0.3s; }
  
  .action-btn {
    background: #fff; border: 1px solid #d6dee6; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; color: #6b7c8f; width: 100%; margin-top: 10px; font-weight: 600;
  }
  .action-btn:hover { border-color: #4a90d9; color: #4a90d9; }
  .action-btn.danger { border-color: #ff6b6b; color: #ff6b6b; }

  /* Рецепты */
  .recipe-card {
    background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid #6ab04c; margin-bottom: 12px;
  }
  .recipe-card h3 { font-size: 1.05rem; margin-bottom: 12px; color: #4a90d9; }
  .recipe-card .ingredients { background: #f8fafc; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; border-left: 3px solid #6ab04c; }
  .recipe-card .ingredients b { display: block; margin-bottom: 4px; color: #1a2b3c; }
  .recipe-card ol { padding-left: 20px; font-size: 0.9rem; }
  .recipe-card ol li { margin-bottom: 6px; }

  @media (min-width: 600px) {
    .builder-row { grid-template-columns: 1fr 1fr 1fr; align-items: end; }
    .builder-row h4 { grid-column: 1 / -1; margin-bottom: 0; }
    .days, .shop-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>🍲 Конструктор меню</h1>
    <p>Выберите блюда на неделю — список покупок соберется сам</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-panel="builder">🛠 Конструктор</button>
    <button class="tab" data-panel="menu">📅 Меню</button>
    <button class="tab" data-panel="shopping">🛒 Покупки</button>
    <button class="tab" data-panel="recipes">📖 Рецепты</button>
  </div>

  <!-- КОНСТРУКТОР -->
  <div class="panel active" id="panel-builder">
    <div style="margin-bottom: 16px; font-size: 0.9rem; color: #6b7c8f;">
      Выберите блюда на каждый день. Изменить выбор можно в любой момент, список покупок обновится автоматически.
    </div>
    <div id="builder-container"></div>
    <button class="action-btn" id="resetWeekBtn">🔄 Сбросить меню на неделю (вернуть по умолчанию)</button>
  </div>

  <!-- МЕНЮ -->
  <div class="panel" id="panel-menu">
    <div class="days" id="days"></div>
  </div>

  <!-- ПОКУПКИ -->
  <div class="panel" id="panel-shopping">
    <div class="progress-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>Прогресс покупок</b>
        <span id="shopProgressText" style="font-size:0.9rem;color:#6b7c8f;">0 / 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="shopProgressFill"></div></div>
      <button class="action-btn" id="resetShop">Сбросить купленные продукты</button>
    </div>
    <div class="shop-grid" id="shopping"></div>
  </div>

  <!-- РЕЦЕПТЫ -->
  <div class="panel" id="panel-recipes">
    <div id="recipes"></div>
  </div>

</div>

<script>
  // ---------- БАЗА ДАННЫХ РЕЦЕПТОВ ----------
  const recipeDB = [
    {
      id: "kotleti",
      name: "Котлеты с пюре",
      category: "обед",
      ingredients: ["Фарш 600г", "Лук 1шт", "Яйцо 1шт", "Хлеб 2ломтя", "Молоко 100мл", "Картофель 800г", "Сливочное масло 30г"],
      steps: ["Хлеб замочить в молоке.", "Смешать фарш, лук, яйцо, хлеб и соль.", "Обжарить котлеты по 3-4 мин, потушить 10 мин под крышкой.", "Картофель отварить и размять с молоком и маслом."]
    },
    {
      id: "tefteli",
      name: "Тефтели с рисом",
      category: "обед",
      ingredients: ["Фарш 600г", "Рис 100г", "Лук 1шт", "Яйцо 1шт", "Томатная паста 2ст.л", "Сметана 3ст.л"],
      steps: ["Рис отварить до полуготовности.", "Смешать фарш, рис, лук, яйцо.", "Сформировать шарики и обжарить.", "Залить соусом (паста+сметана+вода) и тушить 25 мин."]
    },
    {
      id: "gulyash",
      name: "Гуляш с гречкой",
      category: "обед",
      ingredients: ["Говядина 700г", "Лук 1шт", "Морковь 1шт", "Томатная паста 2ст.л", "Мука 1ст.л", "Сметана 2ст.л", "Гречка 250г"],
      steps: ["Мясо обжарить до румяности.", "Добавить лук и морковь.", "Всыпать муку, добавить пасту и воду. Тушить 45 мин.", "Гречку отварить отдельно."]
    },
    {
      id: "pasta_flotski",
      name: "Макароны по-флотски",
      category: "обед",
      ingredients: ["Макароны 400г", "Фарш 500г", "Лук 1шт"],
      steps: ["Отварить макароны.", "Обжарить фарш с луком.", "Смешать и потушить 5 минут."]
    },
    {
      id: "riba",
      name: "Запечённая рыба",
      category: "ужин",
      ingredients: ["Рыба 700г", "Картофель 800г", "Лук 1шт", "Морковь 1шт", "Сметана 3ст.л"],
      steps: ["Картофель нарезать дольками и запекать 20 мин при 200C.", "Рыбу смазать сметаной, положить лук и морковь сверху.", "Запекать еще 20 минут."]
    },
    {
      id: "kurica_tushenaya",
      name: "Тушёная курица с картофелем",
      category: "ужин",
      ingredients: ["Курица 700г", "Картофель 500г", "Лук 1шт", "Морковь 1шт", "Томатная паста 1ст.л"],
      steps: ["Курицу обжарить.", "Добавить лук и морковь.", "Положить картофель, пасту и воду. Тушить 30-40 мин."]
    },
    {
      id: "shangi",
      name: "Шаньги с картофелем",
      category: "обед",
      ingredients: ["Мука 500г", "Молоко 250мл", "Дрожжи 7г", "Сахар 1ст.л", "Яйцо 1шт", "Масло 50г", "Картофель 800г", "Сметана 3ст.л"],
      steps: ["Замесить дрожжевое тесто, дать подойти.", "Сделать пюре.", "Раскатать лепешки, выложить пюре.", "Выпекать при 200C 15-20 мин."]
    },
    {
      id: "kotlety_grachka",
      name: "Котлеты с гречкой",
      category: "ужин",
      ingredients: ["Фарш 500г", "Лук 1шт", "Яйцо 1шт", "Гречка 200г"],
      steps: ["Сделать фарш, сформировать котлеты.", "Обжарить и потушить.", "Отварить гречку."]
    },
    {
      id: "omlet",
      name: "Омлет с сыром",
      category: "завтрак",
      ingredients: ["Яйца 3шт", "Молоко 100мл", "Сыр 50г"],
      steps: ["Взбить яйца с молоком.", "Вылить на сковороду, посыпать сыром.", "Готовить под крышкой 5 мин."]
    },
    {
      id: "syrniki",
      name: "Сырники",
      category: "завтрак",
      ingredients: ["Творог 400г", "Яйцо 1шт", "Мука 3ст.л", "Сахар 1ст.л"],
      steps: ["Смешать творог, яйцо, муку, сахар.", "Сформировать сырники.", "Обжарить или запечь."]
    },
    {
      id: "ovsyanaya",
      name: "Овсяная каша",
      category: "завтрак",
      ingredients: ["Овсянка 200г", "Молоко 500мл", "Банан 1шт"],
      steps: ["Сварить овсянку на молоке.", "Добавить нарезанный банан."]
    },
    {
      id: "frukti",
      name: "Фрукты / Творог",
      category: "перекус",
      ingredients: ["Яблоки 1кг", "Бананы 1кг", "Творог 500г"],
      steps: ["Просто нарезать и подать."]
    }
  ];

  // Меню по умолчанию (ID блюд)
  const defaultWeek = {
    "Понедельник": { "Завтрак": "ovsyanaya", "Обед": "kotleti", "Ужин": "gulyash", "Перекус": "frukti" },
    "Вторник": { "Завтрак": "omlet", "Обед": "tefteli", "Ужин": "riba", "Перекус": "frukti" },
    "Среда": { "Завтрак": "syrniki", "Обед": "pasta_flotski", "Ужин": "kurica_tushenaya", "Перекус": "frukti" },
    "Четверг": { "Завтрак": "ovsyanaya", "Обед": "kotleti", "Ужин": "kotleti_grachka", "Перекус": "frukti" },
    "Пятница": { "Завтрак": "omlet", "Обед": "riba", "Ужин": "tefteli", "Перекус": "frukti" },
    "Суббота": { "Завтрак": "syrniki", "Обед": "shangi", "Ужин": "pasta_flotski", "Перекус": "frukti" },
    "Воскресенье": { "Завтрак": "ovsyanaya", "Обед": "kurica_tushenaya", "Ужин": "kotleti_grachka", "Перекус": "frukti" }
  };

  const daysOfWeek = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
  const mealTypes = ["Завтрак", "Обед", "Ужин", "Перекус"];

  // Хранилище
  let currentWeek = JSON.parse(localStorage.getItem('app_week_menu')) || JSON.parse(JSON.stringify(defaultWeek));
  let shopState = JSON.parse(localStorage.getItem('app_shops')) || {};

  // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
  function getRecipeById(id) {
    return recipeDB.find(r => r.id === id) || { name: "Не выбрано", ingredients: [], steps: [] };
  }

  // ---------- РЕНДЕР КОНСТРУКТОРА ----------
  function renderBuilder() {
    const container = document.getElementById('builder-container');
    container.innerHTML = '';
    
    daysOfWeek.forEach(day => {
      const row = document.createElement('div');
      row.className = 'builder-row';
      let html = `<h4>${day}</h4>`;
      
      mealTypes.forEach(meal => {
        const selectedId = currentWeek[day][meal];
        // Фильтруем рецепты по категории (или показываем все, если перекус)
        let options = recipeDB;
        if (meal === 'Завтрак') options = recipeDB.filter(r => r.category === 'завтрак');
        else if (meal === 'Обед') options = recipeDB.filter(r => r.category === 'обед' || r.category === 'ужин');
        else if (meal === 'Ужин') options = recipeDB.filter(r => r.category === 'ужин' || r.category === 'обед');
        else if (meal === 'Перекус') options = recipeDB.filter(r => r.category === 'перекус');

        let selectHtml = `<div><label>${meal}</label><select data-day="${day}" data-meal="${meal}">`;
        options.forEach(opt => {
          const sel = opt.id === selectedId ? 'selected' : '';
          selectHtml += `<option value="${opt.id}" ${sel}>${opt.name}</option>`;
        });
        selectHtml += `</select></div>`;
        html += selectHtml;
      });
      row.innerHTML = html;
      container.appendChild(row);
    });

    // Обработчик изменения селектов
    container.querySelectorAll('select').forEach(sel => {
      sel.addEventListener('change', (e) => {
        const day = e.target.dataset.day;
        const meal = e.target.dataset.meal;
        currentWeek[day][meal] = e.target.value;
        saveAndRenderAll();
      });
    });
  }

  // ---------- РЕНДЕР МЕНЮ ----------
  function renderMenu() {
    const daysEl = document.getElementById('days');
    daysEl.innerHTML = '';
    
    daysOfWeek.forEach(day => {
      const card = document.createElement('div');
      card.className = 'day-card';
      let html = `<h3>${day}</h3>`;
      
      mealTypes.forEach(meal => {
        const recipeId = currentWeek[day][meal];
        const recipe = getRecipeById(recipeId);
        html += `<div class="meal-item">
          <b>${meal}</b>
          <span>${recipe.name}</span>
        </div>`;
      });
      card.innerHTML = html;
      daysEl.appendChild(card);
    });
  }

  // ---------- ГЕНЕРАЦИЯ СПИСКА ПОКУПОК ----------
  function generateShoppingList() {
    const ingMap = {}; // Название -> количество (чтобы убрать дубли)

    daysOfWeek.forEach(day => {
      mealTypes.forEach(meal => {
        const recipeId = currentWeek[day][meal];
        const recipe = getRecipeById(recipeId);
        
        recipe.ingredients.forEach(ing => {
          // Простейшая очистка: "Фарш 600г" -> "Фарш"
          // В реальном приложении тут нужен парсер, но мы сделаем группировку по первому слову
          const parts = ing.split(' ');
          const name = parts[0];
          const qty = parts.slice(1).join(' ');

          if (!ingMap[name]) {
            ingMap[name] = new Set();
          }
          if (qty) ingMap[name].add(qty);
        });
      });
    });

    // Сортируем по алфавиту
    const sortedNames = Object.keys(ingMap).sort();

    const shopEl = document.getElementById('shopping');
    shopEl.innerHTML = '';
    
    // Просто выводим в одну колонку (можно сгруппировать по категориям, если добавить категории в БД)
    const catCard = document.createElement('div');
    catCard.className = 'shop-cat';
    catCard.innerHTML = `<h3>Список продуктов на неделю</h3>`;
    
    let totalItems = 0;

    sortedNames.forEach(name => {
      totalItems++;
      const qtys = Array.from(ingMap[name]).join(', ');
      const id = `shop-${name}`;
      const isChecked = shopState[id] ? 'checked' : '';
      const doneClass = shopState[id] ? 'done' : '';

      catCard.innerHTML += `
        <div class="shop-item ${doneClass}" id="wrap-${id}">
          <input type="checkbox" id="${id}" data-type="shop" ${isChecked}>
          <label for="${id}">
            <span class="name-text">${name}</span>
            <span class="qty">${qtys}</span>
          </label>
        </div>
      `;
    });

    shopEl.appendChild(catCard);
    
    // Обновляем прогресс
    updateShoppingProgress(totalItems);
    
    // Навешиваем обработчики на новые чекбоксы
    shopEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const id = e.target.id;
        shopState[id] = e.target.checked;
        localStorage.setItem('app_shops', JSON.stringify(shopState));
        document.getElementById('wrap-' + id).classList.toggle('done', e.target.checked);
        updateShoppingProgress(totalItems);
      });
    });
  }

  function updateShoppingProgress(total) {
    const bought = document.querySelectorAll('#shopping input[type="checkbox"]:checked').length;
    document.getElementById('shopProgressText').textContent = `${bought} / ${total}`;
    document.getElementById('shopProgressFill').style.width = (total ? (bought/total*100) : 0) + '%';
  }

  // ---------- РЕНДЕР РЕЦЕПТОВ ----------
  function renderRecipes() {
    const recipesEl = document.getElementById('recipes');
    recipesEl.innerHTML = '';
    
    // Собираем уникальные ID блюд, которые есть в текущей неделе
    const usedIds = new Set();
    daysOfWeek.forEach(day => {
      mealTypes.forEach(meal => {
        usedIds.add(currentWeek[day][meal]);
      });
    });

    // Выводим только те рецепты, которые используются
    usedIds.forEach(id => {
      const recipe = getRecipeById(id);
      if (recipe.name === "Не выбрано") return;

      const card = document.createElement('div');
      card.className = 'recipe-card';
      
      let stepsHtml = recipe.steps.map(step => `<li>${step}</li>`).join('');
      let ingHtml = recipe.ingredients.join(', ');
      
      card.innerHTML = `
        <h3>${recipe.name}</h3>
        <div class="ingredients">
          <b>Ингредиенты:</b> ${ingHtml}
        </div>
        <ol>${stepsHtml}</ol>
      `;
      recipesEl.appendChild(card);
    });
  }

  // ---------- СОХРАНЕНИЕ И ОБЩИЙ РЕНДЕР ----------
  function saveAndRenderAll() {
    localStorage.setItem('app_week_menu', JSON.stringify(currentWeek));
    renderMenu();
    renderShoppingList();
    renderRecipes();
  }

  // ---------- СБРОС ----------
  document.getElementById('resetWeekBtn').addEventListener('click', () => {
    if(!confirm('Вернуть меню по умолчанию на эту неделю?')) return;
    currentWeek = JSON.parse(JSON.stringify(defaultWeek));
    saveAndRenderAll();
    renderBuilder(); // Перерисовываем селекты
  });

  document.getElementById('resetShop').addEventListener('click', () => {
    if(!confirm('Снять все галочки с купленных продуктов?')) return;
    shopState = {};
    localStorage.removeItem('app_shops');
    generateShoppingList(); // Перерисовываем список
  });

  // ---------- ТАБЫ ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
  });

  // ---------- ИНИЦИАЛИЗАЦИЯ ----------
  renderBuilder();
  saveAndRenderAll();

</script>
</body>
</html>
